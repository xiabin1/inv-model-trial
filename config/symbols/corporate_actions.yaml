# Corporate actions applied to raw Databento prices when they are loaded
# (src/data/raw/corporate_actions.py, src/data/raw/ticker_renames.py).
# Stored raw files are never changed.
#
# actions: each entry
#   symbol:   ticker as used in the pipeline
#   date:     ex-date = first trading day at the new price
#   split:    new shares per old share (10-for-1 -> 10; 1-for-5 reverse -> 0.2)
#   spinoff:  {child, ratio, parent_open, child_open}: the factor is computed from the ex-date opens
#             (parent_open / (parent_open + ratio x child_open); see spinoff_factor)
#   factor:   instead of split/spinoff, a direct price multiplier for earlier bars
#   verified: true once checked against an official source
#   source:   where it was checked (company release / SEC filing / exchange notice)
#
# Spin-offs use the ex-date OPENING prices: the strategy holds from 15:58 to the next open, so the
# adjusted overnight move into the ex-date equals what a holder really got (parent + child at the open).
#
# Only entries with verified: true (and no rejected: true) are applied. New events are proposed
# automatically as pending entries (verified: false) and announced in Telegram with Verified / Reject
# buttons; the stock is excluded from the picks until then (src/corporate_action_flow.py).
#   rejected: true  marks a false alarm (e.g. a real price move); kept so it is not proposed again
#   found:          date the entry was proposed, found_by: what found it
# Find candidates by hand with:
#   python3 scripts/detect_corporate_actions.py
# Small spin-offs (a few % of the parent) do not show up there: also check symbols
# that first appear mid-history (see docs/known_issues/corporate_actions.md).
#
# Not recorded on purpose (see docs/known_issues/corporate_actions.md):
#   NVR 2026-03-17, SHW 2025-06-10, URI 2025-08-11, COR 2025-04-07, TDY 2025-06-30,
#   IT 2025-06-11: single bad price prints, not corporate actions.
#   MRNA 2026-08-19 (+84% overnight): real price move; MRNA has never split (checked by user).

