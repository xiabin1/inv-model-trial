# mini_l250 profile (2026-10-10): mini features (EQUS.MINI to 15:58), trained on the S&P 500 / Nasdaq-100 stocks
# plus liquid US stocks >= $250M (src/symbols/liquidity_universe.py); picks from the current stocks only, max 3
# per sector. Data history from scripts/experiments/mini_l250.py.
version:
  daily_features: l50_v2
  minute_features: l250_mini_v1
  labels: l50_mini_v1
  combined_features: l250_mini_v1
schedule:
  start_date: '2024-10-01'
  end_date: '2026-10-09'
storage:
  backend: s3
  local:
    root: data
  s3:
    bucket: portfolio-calc-platform-dev
    prefix: financial/tp1/data
    region: us-east-2
  input:
    minute_features: features/minutes
    daily_features: features/daily
    labels: labels
  output:
    features: features/combined
