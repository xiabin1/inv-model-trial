# b1542_l250 profile (2026-10-08): b1542 features, trained on the S&P 500 / Nasdaq-100 stocks plus liquid US
# stocks with >= $250M median daily dollar volume (src/symbols/liquidity_universe.py); picks from the
# current stocks only, max 4 per sector. Data versions l50_* keep the experiment's history (scripts/experiments/).
version:
  features: l50_v2
  raw_data: l50_v1
  symbols: l250_v1
features:
  feature_set: Alpha158
  custom:
    ma_spread_7_21: Mean($close, 7) / Mean($close, 21) - 1
schedule:
  lookback_days: 120
  start_date: '2024-08-01'
  end_date: '2026-10-07'
storage:
  backend: s3
  local:
    root: data
  s3:
    bucket: portfolio-calc-platform-dev
    prefix: financial/tp1/data
    region: us-east-2
  input:
    raw: raw/session_daily
    symbols: symbols
  output:
    features: features/daily
