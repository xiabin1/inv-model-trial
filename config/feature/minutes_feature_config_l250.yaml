# b1542_l250 profile (2026-10-08): b1542 features, trained on the S&P 500 / Nasdaq-100 stocks plus liquid US
# stocks with >= $250M median daily dollar volume (src/symbols/liquidity_universe.py); picks from the
# current stocks only, max 4 per sector. Data versions l50_* keep the experiment's history (scripts/experiments/).
version:
  features: l50_b1542_v1
  raw_data: l50_v1
  symbols: l250_v1
features:
  frequency: 4m
  feature_set: Alpha158
  custom:
    minutes_vwap_spread: $close / $vwap - 1
    ma_spread_7_21: Mean($close, 7) / Mean($close, 21) - 1
  intraday:
    ret_day: $close / $open - 1
    ret_gap: $open / $prev_close - 1
    ret_last_30m: $close / $close_30m - 1
    ret_last_60m: $close / $close_60m - 1
    range_pos: ($close - $low) / ($high - $low + 1e-12)
    vwap_dev: $close / $vwap - 1
    rvol: $volume / Mean(Ref($volume, 1), 20)
    vol_intraday: $ret_std
    max_drawdown_day: $drawdown
schedule:
  cutoff_before_close: 18
  lookback_days: 20
  workers: 4
  start_date: '2024-08-01'
  end_date: '2026-10-07'
storage:
  backend: s3
  local:
    root: data
  s3:
    bucket: portfolio-calc-platform-dev
    prefix: financial/tp1/data
    region: us-east-2
  input:
    raw: raw/minutes
    symbols: symbols
  output:
    features: features/minutes
