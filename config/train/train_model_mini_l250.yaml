# mini_l250 profile (2026-10-10): mini features (EQUS.MINI to 15:58), trained on the S&P 500 / Nasdaq-100 stocks
# plus liquid US stocks >= $250M (src/symbols/liquidity_universe.py); picks from the current stocks only, max 3
# per sector. Data history from scripts/experiments/mini_l250.py.
version:
  features: l250_mini_v1
  evaluation: mini_l250_v1
schedule:
  train_period:
  - 2025-06-01
  - 2026-04-27
  verification_period:
  - 2026-04-28
  - 2026-09-24
model:
  type: lightgbm
  path: models/us_stock_classifier_mini_l250.joblib
  label:
    method: top_share
    top_share: 0.2
    threshold: 0.01
    vol_adjust: true
    vol_window: 20
  params:
    n_estimators: 200
    learning_rate: 0.05
    num_leaves: 31
    max_depth: -1
    min_child_samples: 20
    subsample: 1.0
    colsample_bytree: 1.0
    reg_alpha: 0.0
    reg_lambda: 0.0
    class_weight: balanced
    random_state: 42
    n_jobs: -1
    verbosity: -1
  test_share: 0.2
prediction:
  period: verification
  top_n: 10
evaluation:
  top_n: 10
  cost_per_trade: 0.001
live:
  variant: weekly_plain_label
  model_path: models/live_classifier_mini_l250.joblib
  top_n: 10
  min_fresh_share: 0.9
  min_feature_share: 0.9
  min_listing_days: 20
  gap_guard_max_move: 0.4
  grace_seconds: 3
  max_wait_seconds: 45
  sector_cap: 3
paper:
  top_n: 10
  report_sizes:
  - 5
  - 10
  capital_per_day: 100000
  sim_model_path: models/paper_sim_classifier_mini_l250.joblib
walk_forward:
  first_test_date: 2025-12-01
  final_holdout_from: 2026-08-01
  top_n:
  - 5
  - 10
  - 30
  - 50
  variants:
  - name: weekly_plain_label
    retrain_every: week
    train_window: expanding
    vol_adjust: false
  - name: weekly_rolling120
    retrain_every: week
    train_window: 120
  - name: weekly_rolling120_threshold
    retrain_every: week
    train_window: 120
    method: threshold
    threshold: 0.01
  - name: weekly_plain_label_from2025-06
    retrain_every: week
    train_window: expanding
    vol_adjust: false
    first_test_date: 2025-06-02
storage:
  backend: s3
  local:
    root: data
  s3:
    bucket: portfolio-calc-platform-dev
    prefix: financial/tp1/data
    region: us-east-2
  input:
    features: features/combined
  output:
    evaluation: evaluation
    predictions: predictions
