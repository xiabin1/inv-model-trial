# Cutoff experiment (b1558): XNAS.BASIC minute features with bars to 15:58; labels = next
# XNAS.BASIC open / 15:57 close (labels/mini_v1, the price actually traded at 15:58). Copy of train_model_mini.yaml.
# Mini profile (src/live.py PROFILES['mini']): minute features from EQUS.MINI, labels and
# daily features from XNAS.BASIC. Copy of train_model.yaml with the differences marked 'mini'.
version:
  features: b1558_v1     # combined features
  evaluation: b1558_v1

schedule:
  train_period: [2025-06-01, 2026-04-27]
  verification_period: [2026-04-28, 2026-09-24]

model:
  type: lightgbm
  path: models/us_stock_classifier_b1558.joblib
  label:
    method: top_share   # top_share: best share of stocks per day | threshold: return > threshold
    top_share: 0.2
    threshold: 0.01     # used only when method is threshold
    vol_adjust: true    # top_share ranks excess return / the stock's typical overnight move
    vol_window: 20      # days of past overnight returns for the typical move
  params:
    n_estimators: 200
    learning_rate: 0.05
    num_leaves: 31
    max_depth: -1
    min_child_samples: 20
    subsample: 1.0
    colsample_bytree: 1.0
    reg_alpha: 0.0
    reg_lambda: 0.0
    class_weight: balanced
    random_state: 42
    n_jobs: -1
    verbosity: -1
  test_share: 0.2      # last 20% of train-period days held out for the test score

prediction:
  period: verification
  top_n: 10

evaluation:
  top_n: 10             # stocks bought per day in the strategy backtest
  cost_per_trade: 0.001 # round trip (buy + sell), subtracted from each day's return

live:                   # python -m src.live nightly | predict | retrain (see src/live.py)
  variant: weekly_plain_label  # walk_forward variant used for the live model (retrained weekly); was weekly_rolling120 until 2026-09-30
  model_path: models/live_classifier_b1558.joblib
  top_n: 10            # stocks in the daily prediction list (5 from 2026-10-01 to 2026-10-02)
  min_fresh_share: 0.9  # share of symbols that must have the bar just before the cutoff
  grace_seconds: 3      # wait this long after the cutoff for the last bar (Live API)
  max_wait_seconds: 45  # give up on the stream this long after the cutoff

paper:                  # mock trades (src/paper.py); ledgers in data/paper/
  top_n: 10             # picks mock-bought each day (top 5 from 2026-10-01 to 2026-10-02)
  report_sizes: [5, 10] # portfolios compared in `python -m src.paper report`
  capital_per_day: 100000 # split equally across the top_n picks (10 x $10,000)
  sim_model_path: models/paper_sim_classifier_b1558.joblib   # weekly models for `simulate`

walk_forward:
  first_test_date: 2025-12-01
  final_holdout_from: 2026-08-01   # excluded from walk-forward tests; already seen by single-split runs
  top_n: [5, 10, 30, 50]   # mini: top 5 is the paper-trading size
  variants:
    - {name: weekly_plain_label, retrain_every: week, train_window: expanding, vol_adjust: false}
    - {name: weekly_rolling120, retrain_every: week, train_window: 120}
    - {name: weekly_rolling120_threshold, retrain_every: week, train_window: 120, method: threshold, threshold: 0.01}
    # mini: the longer history allows testing from mid-2025 too
    - {name: weekly_plain_label_from2025-06, retrain_every: week, train_window: expanding, vol_adjust: false, first_test_date: 2025-06-02}

storage:
  backend: s3
  local:
    root: data
  s3:
    bucket: portfolio-calc-platform-dev
    prefix: financial/tp1/data
    region: us-east-2
  input:
    features: features/combined
  output:
    evaluation: evaluation
    predictions: predictions   # live top-N lists, <predictions>/<version.evaluation>/YYYY-MM-DD.csv
