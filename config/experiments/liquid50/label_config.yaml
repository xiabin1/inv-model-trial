# Experiment liquid50 (scripts/experiments/liquid50.py); generated, not used by live jobs
version:
  labels: l50_mini_v1
  raw_data: l50_v1
  minute_features: mini_v1
label:
  field: Ref($open, -1) / $close_cutoff - 1
  column: label
schedule:
  start_date: '2024-08-01'
  end_date: '2026-10-01'
storage:
  backend: s3
  local:
    root: data
  s3:
    bucket: portfolio-calc-platform-dev
    prefix: financial/tp1/data
    region: us-east-2
  input:
    raw: raw/session_daily
    minute_features: features/minutes
    cutoff_raw:
      raw: raw/minutes
      version: l50_v1
      cutoff_before_close: 2
  output:
    labels: labels
