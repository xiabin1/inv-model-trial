# Experiment liquid50 (scripts/experiments/liquid50.py); generated, not used by live jobs
version:
  features: l50_v2
  raw_data: l50_v1
  symbols: l50_v1
features:
  feature_set: Alpha158
  custom:
    ma_spread_7_21: Mean($close, 7) / Mean($close, 21) - 1
schedule:
  lookback_days: 120
  start_date: '2024-08-01'
  end_date: '2026-10-02'
storage:
  backend: s3
  local:
    root: data
  s3:
    bucket: portfolio-calc-platform-dev
    prefix: financial/tp1/data
    region: us-east-2
  input:
    raw: raw/session_daily
    symbols: symbols
  output:
    features: features/daily
