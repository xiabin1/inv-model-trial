# Experiment liquid50 (scripts/experiments/liquid50.py); generated, not used by live jobs
version:
  data: l50_v1
  symbols: l50_v1_pull
provider:
  provider: databento
  api_key_env: DATABENTO_API_KEY
  dataset: XNAS.BASIC
  stype_in: raw_symbol
schedule:
  interval: 1m
  start_date: '2024-07-01'
  end_date: '2026-10-02'
  fetch:
    max_workers: 6
storage:
  backend: s3
  local:
    root: data/raw/minutes
  s3:
    bucket: portfolio-calc-platform-dev
    prefix: financial/tp1/data/raw/minutes
    region: us-east-2
